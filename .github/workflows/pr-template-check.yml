name: PR 描述校验

# PR 描述里缺必填节时变红，并指出缺了哪一节。
# 校验脚本优先取 base 分支上的版本，避免 PR 通过改脚本来放松自己的门禁；
# base 分支上还没有脚本时（即引入本门禁的那个 PR）回退到当前分支的版本。
# 注意：workflow 文件本身仍随 PR 的合并结果执行，这只是缓解措施；
# 要让校验真正阻断合并，需在仓库设置里把它设为 required status check。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-template-check:
    name: PR 描述必填节校验
    # Dependabot 的 PR 描述由平台自动生成（版本对比 + 发布说明），结构上不可能带上
    # 本仓库模板的必填小节，对这类 PR 执行只会产生恒红的噪音，提交者也无从补齐，故直接跳过。
    # 这里判「PR 的作者」而不是 github.actor：actor 是触发本次运行的人，
    # 维护者一旦编辑 / 重新打开 / 触发 rebase 这类 PR，actor 就变成维护者本人，
    # 用 actor 判会重新跑起这道注定失败的门禁、又变回恒红；PR 作者才是不变的那个。
    # 标题门禁（Conventional Commits）没有跳过，对 Dependabot 仍然生效。
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 合并结果（脚本兜底来源）
        uses: actions/checkout@v7

      - name: 检出 base 分支（校验脚本首选来源）
        uses: actions/checkout@v7
        # base 的提交可能已被 rebase / 回收而取不到；此时退回当前分支的脚本，不要因此把校验判红。
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: 校验 PR 描述
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const bodyPath = `${process.env.RUNNER_TEMP}/pr_body.md`;
            fs.writeFileSync(bodyPath, context.payload.pull_request.body || '', 'utf8');

            const baseScript = '.base/scripts/check_pr_body.mjs';
            const headScript = 'scripts/check_pr_body.mjs';
            const script = fs.existsSync(baseScript) ? baseScript : headScript;
            core.info(`校验脚本：${script}`);
            // 空文件也会让 node 静默退出 0，先确认脚本确实存在且有内容，避免门禁假绿。
            if (!fs.existsSync(script) || fs.statSync(script).size === 0) {
              core.setFailed(`校验脚本缺失或为空：${script}`);
              return;
            }

            try {
              core.info(
                execFileSync(process.execPath, [script, bodyPath], {
                  encoding: 'utf8',
                })
              );
            } catch (error) {
              const detail = `${error.stdout || ''}${error.stderr || ''}`.trim();
              core.setFailed(
                detail ||
                  `校验脚本异常退出（exit=${error.status}，signal=${error.signal}）：${error.message}`
              );
            }
