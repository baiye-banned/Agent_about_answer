name: PR 标题校验

# PR 标题必须符合 Conventional Commits，否则变红。
# 校验脚本优先取 base 分支上的版本，避免 PR 通过改脚本来放松自己的门禁；
# base 分支上还没有脚本时（即引入本门禁的那个 PR）回退到当前分支的版本。
# 注意：workflow 文件本身仍随 PR 的合并结果执行，这只是缓解措施；
# 要让校验真正阻断合并，需在仓库设置里把它设为 required status check。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title-check:
    name: PR 标题规范校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 合并结果（脚本兜底来源）
        uses: actions/checkout@v7

      - name: 检出 base 分支（校验脚本首选来源）
        uses: actions/checkout@v7
        # base 的提交可能已被 rebase / 回收而取不到；此时退回当前分支的脚本，不要因此把校验判红。
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: 校验 PR 标题
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const titlePath = `${process.env.RUNNER_TEMP}/pr_title.txt`;
            fs.writeFileSync(titlePath, context.payload.pull_request.title || '', 'utf8');

            const baseScript = '.base/scripts/check_title.mjs';
            const headScript = 'scripts/check_title.mjs';
            const script = fs.existsSync(baseScript) ? baseScript : headScript;
            core.info(`校验脚本：${script}`);
            // 空文件也会让 node 静默退出 0，先确认脚本确实存在且有内容，避免门禁假绿。
            if (!fs.existsSync(script) || fs.statSync(script).size === 0) {
              core.setFailed(`校验脚本缺失或为空：${script}`);
              return;
            }

            try {
              core.info(
                execFileSync(process.execPath, [script, titlePath], {
                  encoding: 'utf8',
                })
              );
            } catch (error) {
              const detail = `${error.stdout || ''}${error.stderr || ''}`.trim();
              core.setFailed(
                detail ||
                  `校验脚本异常退出（exit=${error.status}，signal=${error.signal}）：${error.message}`
              );
            }
