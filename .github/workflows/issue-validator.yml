name: Issue 结构校验

# issue 标题必须以 [BUG] 或 [FEATURE] 开头，且必填小节不为空。
# issues 事件使用默认分支上的 workflow，校验脚本随默认分支更新。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

jobs:
  issue-validator:
    name: Issue 结构校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出默认分支（校验脚本来源）
        uses: actions/checkout@v7

      - name: 校验 issue 结构
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const issue = context.payload.issue;
            const issuePath = `${process.env.RUNNER_TEMP}/issue.md`;
            fs.writeFileSync(issuePath, `${issue.title}\n\n${issue.body || ''}`, 'utf8');

            const script = 'scripts/check_issue.mjs';
            // 脚本缺失时 node 只会抛 ERR_MODULE_NOT_FOUND，先给出明确结论。
            if (!fs.existsSync(script) || fs.statSync(script).size === 0) {
              core.setFailed(`校验脚本缺失或为空：${script}`);
              return;
            }

            try {
              core.info(
                execFileSync(process.execPath, [script, issuePath], {
                  encoding: 'utf8',
                })
              );
            } catch (error) {
              const detail = `${error.stdout || ''}${error.stderr || ''}`.trim();
              core.setFailed(
                detail ||
                  `校验脚本异常退出（exit=${error.status}，signal=${error.signal}）：${error.message}`
              );
            }
