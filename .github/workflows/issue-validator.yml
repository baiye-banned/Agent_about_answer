name: Issue 结构校验

# issue 标题必须以 [BUG] 或 [FEATURE] 开头，且必填小节不为空。
# issues 事件使用默认分支上的 workflow，校验脚本随默认分支更新。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

jobs:
  issue-validator:
    name: Issue 结构校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出默认分支（校验脚本来源）
        uses: actions/checkout@v4

      - name: 校验 issue 结构
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const issue = context.payload.issue;
            const issuePath = `${process.env.RUNNER_TEMP}/issue.md`;
            fs.writeFileSync(issuePath, `${issue.title}\n\n${issue.body || ''}`, 'utf8');
            try {
              core.info(
                execFileSync(process.execPath, ['scripts/check_issue.mjs', issuePath], {
                  encoding: 'utf8',
                })
              );
            } catch (error) {
              const detail = `${error.stdout || ''}${error.stderr || ''}`.trim();
              core.setFailed(detail || error.message);
            }
