name: Secret Scan

# Every branch on push, plus pull requests. Unfiltered `push:` also covers the
# release branches (develop / main).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Layer 1: dependency-free pattern scan, identical to the local pre-check.
      # A finding makes this step fail, which fails the job.
      - name: Pattern scan (scripts/scan_secrets.sh)
        run: bash scripts/scan_secrets.sh

      # Layer 2: gitleaks over the full git history, including the commits a
      # push or pull request adds. A finding makes the action fail.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
