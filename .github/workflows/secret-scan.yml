name: Secret Scan

# Every branch on push, plus pull requests. Unfiltered `push:` also covers the
# release branches (develop / main).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      self_test:
        description: "Plant a fake secret, require the scan to go red, then green once it is removed"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks binary has to exist before the script runs: the script
      # scans the full history with it, and exits non-zero when it is missing,
      # so a broken install can never pass as a clean scan. The download is
      # checked against the release checksums before it is unpacked, so a
      # tampered or truncated artifact fails here instead of scanning.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          artifact="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$artifact" "$base/$artifact"
          curl -sSfL -o "gitleaks_checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $artifact\$" "gitleaks_checksums.txt" | sha256sum -c -
          tar -xzf "$artifact" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      # Layer 1: dependency-free pattern scan over every tracked and untracked
      # file. Layer 2: gitleaks over the full history, plus the working tree.
      # A finding - or a missing gitleaks - fails this step, and so the job.
      - name: Scan secrets (scripts/scan_secrets.sh)
        run: bash scripts/scan_secrets.sh

      # Official action on top: reports the pushed commits / pull request range
      # and adds the job summary. A finding fails the action.
      - name: gitleaks (commits in this push / pull request)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # Dispatch-only self-test of the gate itself, so "this gate can go red" is
      # reproducible on demand and not just a claim: a runtime-generated fake key
      # is written to a throwaway directory outside the checkout and the scan
      # must return exactly 1 (findings); after removing the file it must return
      # 0 again. Nothing is committed, and any other outcome (a silent pass, a
      # crash, a missing gitleaks) fails this step instead of being mistaken for
      # proof that the gate works. The token is generated at run time so this
      # file itself never contains a string the scan would flag.
      - name: Self-test - the scan must go red on a planted secret
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.self_test == 'true'
        run: |
          set -u
          fixture="$(mktemp -d)"
          token="sk-$(openssl rand -hex 24)"
          # The key name is passed as an argument rather than written as a
          # literal "OPENAI_API_KEY=<value>" assignment: that shape is exactly
          # what the built-in pattern scan flags, and this file is scanned too.
          printf '%s=%s\n' OPENAI_API_KEY "$token" > "$fixture/leak.py"
          rc=0
          bash scripts/scan_secrets.sh "$fixture" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::self-test: a planted secret must exit 1, got $rc"
            exit 1
          fi
          rm -f "$fixture/leak.py"
          rc=0
          bash scripts/scan_secrets.sh "$fixture" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::self-test: the scan must exit 0 once the file is removed, got $rc"
            exit 1
          fi
          echo "self-test OK: exit 1 with the planted secret, exit 0 after removing it"
